name = "pollenia-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# postgres.js（cloudflare:sockets 経由の TCP 接続）を Workers ランタイムで動かすために必要。
compatibility_flags = ["nodejs_compat"]

# シークレット（DEVICE_AUTH_SECRET / RESEND_API_KEY / ANTHROPIC_API_KEY / STRIPE_* など）は
# コードにも wrangler.toml にも書かない。ローカルは .dev.vars、本番は `wrangler secret put`。
# .dev.vars.example を参照。

# 公開 URL。Worker Custom Domain（deploy 時に DNS レコードと証明書が作られる。他の tomu アプリと同じ方式）。
routes = [{ pattern = "pollenia.tomu-ai.dev", custom_domain = true }]
# workers.dev は使わない（2026-10-22 停止。Stripe Webhook も pollenia.tomu-ai.dev に移行済み）。
workers_dev = false

# 秘密ではない設定値。ログインコードのメール送信元（Resend で tomu-ai.dev は verified）。
[vars]
MAIL_FROM = "Pollenia <noreply@tomu-ai.dev>"
# 週1メールのリンクの起点（cron にはリクエストが無いため）
APP_ORIGIN = "https://pollenia.tomu-ai.dev"

# 「次の作業」の週1メール（src/scheduled.ts）。毎週月曜 8:00 JST = 日曜 23:00 UTC に送り始め、
# 月曜 9:00〜20:00 JST（月曜 0〜11 時 UTC）にも毎時動かす。1 回に処理するのは DIGEST_MAX_PER_RUN 人までなので、
# 残った人・送信に失敗した人を同じ日のうちに拾う（今日すでに処理した人は task_digest_last_sent_on で除くので二重に送らない）。
# 曜日は名前で書く（Cloudflare の数字は 1 = 日曜〜7 = 土曜で、一般的な cron の 0 = 日曜と違う。0 は登録できない）。
# ローカルで試す: npm run dev -- --test-scheduled → curl "http://localhost:8787/__scheduled?cron=0+23+*+*+SUN"
[triggers]
crons = ["0 23 * * SUN", "0 0-11 * * MON"]

# --- 利用者ごとの回数制限（src/lib/rate-limit.ts。Workers の Rate Limiting バインディング）---
# 書き込みの多い操作を、検証済み uid ごとに数える（期間は 10 か 60 秒。拠点ごとの近似）。
# namespace_id はアカウント内で一意の整数（ほかの Worker と数を共有しないよう、pollenia 専用の番号）。
# ログインなしのルート（/public/gallery・/public/unsubscribe）は、ダッシュボードの Rate Limiting（IP ごと）で守る。
[[ratelimits]]
name = "IMPORT_LIMITER"      # POST /api/import/plants（内容の確認を含む）: 1 分に 10 回まで
namespace_id = "40701"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "EXCHANGE_LIMITER"    # POST /api/exchange（譲ります・探しています）: 1 分に 5 回まで
namespace_id = "40702"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "PHOTO_LIMITER"       # POST /api/plants/:id/photos（写真の追加。まとめ取り込みは 1 回 30 枚）: 1 分に 40 枚まで
namespace_id = "40703"
  [ratelimits.simple]
  limit = 40
  period = 60

# --- 画面（frontend/ をそのまま静的配信。ビルドなし）---
# 静的ファイルに一致したパスは Worker を通らずに返る。一致しないパス（/api/*・/auth/*・
# /public/plants/*・/photos/*）が Worker に来る。画面と API が同じオリジンになるので、
# 認証は Cookie（workers-auth の transport: 'cookie'）で CORS は不要。
[assets]
directory = "../frontend"
binding = "ASSETS"

# --- 写真（R2）---
# 本番前に一度だけ作成する: npx wrangler r2 bucket create pollenia-photos
# ローカルの wrangler dev では Miniflare のローカルストレージ（.wrangler/state）になる。
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pollenia-photos"

# --- Hyperdrive（本番の DB 接続。lib/db.ts が HYPERDRIVE.connectionString を最優先で使う）---
# 本番デプロイ前に一度だけ Neon を origin にした Hyperdrive 設定を作成し、下の id を出力値で差し替える:
#   npx wrangler hyperdrive create pollenia-neon --caching-disabled \
#     --connection-string="<Neon の直接接続（-pooler なし）の接続文字列>"
# --caching-disabled は必須（workers-auth の pg ストアの要件。キャッシュされた SELECT で
# 失効済みセッションや使用済みコードが通らないようにする）。
# 接続文字列（パスワード含む）は Cloudflare 側の Hyperdrive 設定にのみ保存され、
# コード・この toml・シークレットのどこにも置かない。
#
# 旧 Supabase 用の設定 pollenia-db（786b6bea...）は使わない（旧構成の片付けで削除予定）。
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "141ea6360094407eb11b2da6ae687f5d"  # pollenia-neon（origin: Neon pollenia / caching disabled）
# ローカルの接続先は toml に書かない（パスワードがランダム生成のため）。`npm run dev` が
# リポジトリ直下 .env の DATABASE_URL を CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
# として wrangler dev に渡す（scripts/dev.mjs）。
